name: Sync upstream release

on:
  schedule:
    - cron: '0 2,8,14,20 * * *' # Every 6h UTC (09, 15, 21, 03 VN)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to sync (e.g. v2.6.2). Leave empty to auto-detect latest.'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  sync:
    name: Sync with upstream blockscout/frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT required to push .github/workflows/ changes
          # GITHUB_TOKEN cannot modify workflow files
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/blockscout/frontend.git || true
          git fetch upstream --tags --force

      - name: Determine target tag
        id: target
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            # Prefer the newest STABLE release (no -alpha/-beta/-rc suffix).
            # Fall back to the newest non-alpha prerelease (beta/rc) only when no
            # stable release exists. Never auto-sync -alpha tags.
            TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vE -- '-' | head -1)
            if [ -z "$TAG" ]; then
              TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -ivE -- '-alpha' | head -1)
            fi
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No upstream release tag matched 'v[0-9]*.[0-9]*.[0-9]*'. Aborting."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TAG"

          # Check if we already synced this tag
          MARKER_TAG="synced-$TAG"
          if git rev-parse "$MARKER_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already synced $TAG, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will sync $TAG"
          fi

      - name: Merge upstream tag
        if: steps.target.outputs.skip == 'false'
        id: merge
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merge upstream tag into current branch
          if git merge "$TAG" --no-edit -m "Merge upstream $TAG"; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "::warning::Merge conflict detected. Creating PR instead."
            git merge --abort
            echo "result=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Push and tag
        if: steps.target.outputs.skip == 'false' && steps.merge.outputs.result == 'success'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          git push origin HEAD

          # Create marker tag so we don't re-sync
          git tag "synced-$TAG"
          git push origin "synced-$TAG"

          # Create/update release tag to trigger docker-publish
          git tag "$TAG" --force
          git push origin "$TAG" --force

      - name: Create release
        if: steps.target.outputs.skip == 'false' && steps.merge.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin gh to this fork. Without this, gh resolves the default repo
          # from git remotes and prefers the one named "upstream"
          # (blockscout/frontend, added earlier in this job), so release
          # create/delete hits the upstream repo and fails with HTTP 403.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          # Delete existing release if any (from upstream fork sync)
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "DOScan Frontend $TAG" \
            --notes "Synced from upstream [blockscout/frontend $TAG](https://github.com/blockscout/frontend/releases/tag/$TAG)" \
            --latest

      - name: Create PR on conflict
        if: steps.target.outputs.skip == 'false' && steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BRANCH="sync-upstream-${TAG}"

          git checkout -b "$BRANCH"
          git merge "$TAG" --no-edit || true

          # Stage everything including conflict markers
          git add -A
          git commit -m "WIP: Merge upstream $TAG (has conflicts)" --no-verify || true
          git push origin "$BRANCH" --force

          # GitHub's GraphQL createPullRequest replica lags behind the REST
          # branches endpoint. Even after the branch is visible via REST, the
          # GraphQL mutation can return: "No commits between main and BRANCH".
          # Retry the PR creation itself with backoff.
          PR_BODY="$(cat <<EOF
          ## Upstream Sync - $TAG

          Auto-merge with upstream \`$TAG\` failed due to conflicts.

          **To resolve:**
          1. Check out this branch locally
          2. Resolve conflicts
          3. Push and merge this PR
          4. Then create tag \`$TAG\` to trigger Docker build

          [Upstream release notes](https://github.com/blockscout/frontend/releases/tag/$TAG)
          EOF
          )"
          # Use REST API directly — gh pr create uses GraphQL which has a
          # longer replication lag against new branches (>30s observed).
          # REST /pulls accepts the head SHA directly and works immediately.
          PR_TITLE="Sync upstream $TAG (merge conflicts)"

          # Check if PR already exists for this branch — skip if so
          EXISTING_PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open" --jq ".[] | select(.head.ref==\"$BRANCH\") | .number" 2>/dev/null | head -1)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH, skipping creation"
            exit 0
          fi

          for attempt in 1 2 3 4 5 6; do
            HTTP_RESPONSE=$(jq -n --arg t "$PR_TITLE" --arg b "$PR_BODY" --arg h "$BRANCH" \
              '{title:$t, body:$b, head:$h, base:"main"}' | \
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
                --input - 2>&1)
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "PR created successfully on attempt $attempt"
              exit 0
            fi
            if echo "$HTTP_RESPONSE" | grep -q "A pull request already exists"; then
              echo "PR already exists for $BRANCH"
              exit 0
            fi
            echo "PR creation failed (attempt $attempt): $HTTP_RESPONSE"
            echo "Retrying in 5s..."
            sleep 5
          done
          echo "::error::PR creation failed after 6 attempts"
          exit 1
